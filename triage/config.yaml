# config.yaml – single source of truth for every setting.
# Nothing is hardcoded in the Python files; they all read from here.

data:
  path: data/tickets.csv
  id_column: id
  subject_column: subject
  body_column: body
  received_column: received_at
  customer_column: customer
  max_chars_to_model: 2000      # truncate long logs before sending to LLM
  head_chars: 1400              # keep this many chars from the start
  tail_chars: 500               # keep this many chars from the end

categories:   # name: one-line definition shown to the model
  billing: "Charges, refunds, invoices, renewals, promo codes, payment method changes"
  account_access: "Login, password reset, two-factor, locked out, change email or details, close or delete account"
  technical_issue: "Device, hub, camera or app not working, crashes, sync, lag, export failures"
  shipping_delivery: "Tracking, late or missing orders, wrong or damaged item, address change, shipping availability"
  security_fraud: "Unauthorised payments, hacked account, suspicious activity, data breach"
  legal_privacy: "Legal threats, formal complaints, data privacy or data access requests"
  product_question: "How-to questions and pre-sales questions about features"
  sales_partnership: "Reseller, business or partnership enquiries"
  feedback: "Praise, suggestions, feature ideas"
  other: "Job applications, spam, test messages, anything that does not fit"

priorities:
  urgent: "Active harm or very wide impact: live fraud, many users or a whole business down, imminent lockout, legal threat"
  high: "One customer fully blocked or money wrongly taken: cannot log in, app or hub will not start, double charge"
  medium: "Degraded service or order problem with a workaround: slow app, late delivery, wrong item"
  low: "Questions, requests, praise, suggestions, nothing is broken"

thresholds:
  normal_confidence: 0.70
  urgent_confidence: 0.85       # stricter for high/urgent – wrong urgent call is costly
  min_chars: 10                 # tickets shorter than this go straight to human review

model:
  provider: mock                # mock | anthropic | openai | gemini
  name: ""
  api_key_env: ""
  timeout_seconds: 20
  max_retries: 3
  max_concurrency: 10
  prompt_version: v1

mock:
  timeout_rate: 0.03
  invalid_json_rate: 0.03
  low_confidence_rate: 0.10
  slow_response_rate: 0.05

safety:
  urgent_keywords:
    - outage
    - "all devices"
    - offline
    - "cannot log in"
    - "locked out"
    - fraud
    - hacked
    - "not mine"
    - unauthorised
    - unauthorized
    - "charged twice"
    - breach
    - lawsuit
    - legal
    - stolen
    - urgent
  injection_patterns:
    - "ignore all previous"
    - "ignore previous instructions"
    - "system note"
    - "you are now"
    - "do not send for review"
    - "classify this ticket as"
